# aws - ecr image
server:
  forward-headers-strategy: framework
  port: 8888
  
spring:

  # mariadb settings
  datasource:
    # ${} 외부변수값은 어디에? k8s - secret 생성하여 파드 실행시 주입할 예정
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:3306/inspire?useSSL=true&requiredSSL=true
    username: ${DB_ADMIN}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate: 
      # create, create-drop, update, none
      ddl-auto: create
      # 콘솔출력
    show-sql: true
    properties:
      hibernate:
        # h2
        # dialect: org.hibernate.dialect.H2Dialect
        # mariadb
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true 
  
  data:
    redis:
      # host 설정은 order_redis.yml 서비스 이름으로 변경.
      host: redis-service # metadata: name을 적어야 함.
      port: 6379
      password: 
      timeout: 6000ms

jwt:
  secret: khs-super-secret-key-for-jwt-1234

